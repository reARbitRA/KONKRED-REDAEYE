    <style>
        :root {
            --konkred-red: #FF003C;
            --konkred-orange: #FF8C00;
            --konkred-yellow: #FFD700;
            --konkred-void: #000000;
            --konkred-glass: rgba(10, 10, 10, 0.7);
            --konkred-border: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--konkred-void);
            color: #FFFFFF;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
        }
        
        #root {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        /* Scanline Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        .glass-pane {
            background-color: var(--konkred-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--konkred-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Enhanced Scrollbars */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border: 2px solid #050505;
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--konkred-red);
        }

        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #222 #050505;
        }

        .technical-font {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.7);
        }
        
        .border-glow {
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2), inset 0 0 10px rgba(255, 0, 60, 0.1);
        }
    </style>
