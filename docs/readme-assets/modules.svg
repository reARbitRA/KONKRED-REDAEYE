<svg width="1600" height="820" viewBox="0 0 1600 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="820" fill="#050505"/>
  <text x="80" y="86" fill="#fff" font-family="Inter, Arial" font-size="44" font-weight="900">Platform Surface</text>
  <text x="80" y="120" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="18">A repository with two serious layers: application + embedded research library.</text>
  <g font-family="Inter, Arial">
    <rect x="80" y="170" width="690" height="250" rx="28" fill="#0d1117" stroke="rgba(255,255,255,0.10)"/>
    <text x="112" y="220" fill="#f5279c" font-size="20" font-weight="800">APPLICATION</text>
    <text x="112" y="272" fill="#fff" font-size="34" font-weight="900">Mission-control workspace</text>
    <text x="112" y="316" fill="#b9c3e6" font-size="22">Auth • Provider links • Reporting • Codex browser • Electron • PWA • Android</text>
    <text x="112" y="364" fill="#8b949e" font-size="20">Core entry points: src/, electron/, public/, firebase, Docker, tests.</text>

    <rect x="830" y="170" width="690" height="250" rx="28" fill="#0d1117" stroke="rgba(255,255,255,0.10)"/>
    <text x="862" y="220" fill="#f97516" font-size="20" font-weight="800">REDAEYE_LIBRARY</text>
    <text x="862" y="272" fill="#fff" font-size="34" font-weight="900">Corpus + tools + preserved raw lineage</text>
    <text x="862" y="316" fill="#b9c3e6" font-size="22">Entries • Validator • Navigator • Harness • Bounty • Legacy raw archive</text>
    <text x="862" y="364" fill="#8b949e" font-size="20">Keeps v2 labels disciplined without losing historical raw records.</text>
  </g>
  <g font-family="Inter, Arial">
    <rect x="80" y="470" width="460" height="250" rx="24" fill="#111111" stroke="rgba(255,255,255,0.10)"/>
    <text x="112" y="520" fill="#fff" font-size="30" font-weight="900">Security DNA</text>
    <text x="112" y="562" fill="#b9c3e6" font-size="20">Session-only provider keys, Electron hardening, SVG sanitization, CSP, schema validation.</text>
    <text x="112" y="642" fill="#2ea043" font-size="28" font-weight="800">Controlled-beta posture</text>

    <rect x="570" y="470" width="460" height="250" rx="24" fill="#111111" stroke="rgba(255,255,255,0.10)"/>
    <text x="602" y="520" fill="#fff" font-size="30" font-weight="900">Corpus State</text>
    <text x="602" y="562" fill="#b9c3e6" font-size="20">240 enhanced / validated entries, 116 full-depth, 17/17 QA, zero validator failures.</text>
    <text x="602" y="642" fill="#f5279c" font-size="28" font-weight="800">Lossless raw preservation active</text>

    <rect x="1060" y="470" width="460" height="250" rx="24" fill="#111111" stroke="rgba(255,255,255,0.10)"/>
    <text x="1092" y="520" fill="#fff" font-size="30" font-weight="900">Operational Model</text>
    <text x="1092" y="562" fill="#b9c3e6" font-size="20">Use the app to work. Use the library to inspect, validate, archive, and transport the corpus.</text>
    <text x="1092" y="642" fill="#f97516" font-size="28" font-weight="800">Two layers. One repository.</text>
  </g>
</svg>
